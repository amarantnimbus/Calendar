name: Build APK

# Builds a debug APK that can be installed on a phone.
# It runs by itself every time files are pushed to the repository,
# and it can also be started by hand from the "Actions" tab.
on:
    push:
        paths-ignore:
            - "README.md"
            - "CHANGELOG.md"
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-24.04
        steps:
            - name: Check out the code
              uses: actions/checkout@v4

            - name: Set up Java 17
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: 17

            # The runner already includes the Android SDK. This only accepts its licenses,
            # so Gradle can download the pieces it needs.
            - name: Accept Android SDK licenses
              run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v4

            # Signs every build with the same key, so Android accepts updates over the installed app.
            # The key lives in the repository "secrets"; without them the build still works (unsigned by us).
            - name: Prepare the signing key
              shell: bash
              env:
                  KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
                  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
                  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
                  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
              run: |
                  if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
                      echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/calendari.jks"
                      echo "SIGNING_STORE_FILE=$RUNNER_TEMP/calendari.jks" >> "$GITHUB_ENV"
                      echo "SIGNING_STORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
                      echo "SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
                      echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
                      echo "Signing key found."
                  else
                      echo "No signing key in secrets: using the default debug key."
                  fi

            - name: Build the debug APK
              shell: bash
              run: |
                  chmod +x ./gradlew
                  ./gradlew assembleFossDebug --console=plain 2>&1 | tee build.log

            # If the build fails, show the compiler errors in the summary of the run
            # (under "Annotations"), so they are easy to copy.
            - name: Show the errors
              if: failure()
              shell: bash
              run: |
                  msg=$(grep -E "^e: " build.log | sed -e 's/^e: //' -e 's#file:///home/runner/work/Calendar/Calendar/##' | head -20 | paste -sd'|' - || true)
                  echo "::error title=Kotlin errors::${msg:-no lines starting with e: were found}"

            - name: Upload the APK
              uses: actions/upload-artifact@v4
              with:
                  name: calendar-turnos-apk
                  path: app/build/outputs/apk/foss/debug/*.apk
                  if-no-files-found: error
